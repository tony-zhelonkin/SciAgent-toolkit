# tags.yaml — sciagent skill tag vocabulary.
# Single source of truth. Adding a tag = edit + PR.
# See docs/proposals/sciagent-extension-design-spec.md ADR-001.
#
# Tags are THEMATIC FAMILIES used for `sciagent inject --tag <name>`: each tag
# pulls in every skill that carries it. They are a small, memorable taxonomy —
# NOT implementation details or per-skill strings. A good tag answers "what
# analysis family does this belong to", not "what library does it wrap".
# Tool/format details (cellxgene, tiledb, geneformer, cli, llm, ...) belong in
# the skill name and description, not the tag vocabulary.

tags:
  - name: trajectory
    description: Time-trajectory inference (pseudotime, RNA velocity, dynamics).
    since: 2026-05-24

  - name: integration
    description: Batch correction and multi-sample harmonization (scVI, scANVI, harmony, MNN).
    since: 2026-05-24

  - name: annotation
    description: Cell-type and cell-state assignment (marker-based, LLM consensus, reference-projection, manual rescue).
    since: 2026-05-24

  - name: reference-mapping
    description: Label transfer and reference projection — mapping a query onto an annotated atlas/reference (scArches, Census label transfer, hierarchical reference learning).
    since: 2026-05-30

  - name: de
    description: Differential expression (limma, edgeR, DESeq2, scanpy.rank_genes_groups).
    since: 2026-05-24

  - name: pathway
    description: Pathway analysis — enrichment (fgsea, hypergeometric), activity scoring (GSVA, AUCell, decoupleR), signatures.
    since: 2026-05-24

  - name: grn
    description: Gene regulatory network and transcription-factor activity inference (SCENIC, SCENIC+, regulons).
    since: 2026-05-30

  - name: factor-analysis
    description: Factor analysis super-family — multi-view / multi-block / multi-modal latent decomposition (MOFA, FAMD/MFA from FactoMineR & prince, mixOmics/DIABLO, scITD Tucker, sciRED PCA+varimax). Covers both probabilistic (Bayesian VI) and geometric (Benzécri-school SVD) generations.
    since: 2026-05-28

  - name: metaprogram
    description: Unsupervised gene-program / metaprogram discovery — NMF, consensus-NMF, signature extraction across samples.
    since: 2026-05-30

  - name: multimodal
    description: Multi-modal and multi-omic integration (CITE-seq/WNN, multiome RNA+ATAC, paired/unpaired cross-modality, MuData/h5mu).
    since: 2026-05-30

  - name: chromatin
    description: Chromatin / scATAC analysis — peaks, topics, accessibility, CRE-gene linkage, coverage.
    since: 2026-05-30

  - name: motif
    description: Motif and transcription-factor binding analysis — motif enrichment, chromVAR deviations, footprinting.
    since: 2026-05-30

  - name: qc
    description: Quality control (per-cell, per-sample, batch-level).
    since: 2026-05-24

  - name: preprocessing
    description: Upstream processing — alignment/quantification, count-matrix assembly, doublet/ambient handling, peak set construction.
    since: 2026-05-30

  - name: conversion
    description: Object/format interconversion and interoperability (Seurat <-> AnnData <-> Scanpy, h5ad/h5mu, R <-> Python bridges, viewer exports).
    since: 2026-05-30

  - name: viz
    description: Plotting, dimensionality-reduction display, figure composition.
    since: 2026-05-24

  - name: report
    description: Knit/render, publication-figure pipelines, captions, README/Methods generation, skill documentation.
    since: 2026-05-24

  - name: hosting
    description: Interactive data hosting and exploration apps (cellxgene/CXG hosts, ShinyMultiome and similar browsers).
    since: 2026-05-30

  - name: architecture
    description: Software architecture — design patterns, refactoring guidance, system structure.
    since: 2026-05-24

  - name: tooling
    description: General-purpose tool/utility building (CLIs, MCP servers, file-handling helpers, dev workflows, skill authoring).
    since: 2026-05-24
