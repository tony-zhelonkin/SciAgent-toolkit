# rnaseq-fastq-preprocessing.yaml — bulk RNA-seq FASTQ preprocessing (TE-compatible)
#
# Purpose
#   Upstream, ops-heavy lane: take bulk RNA-seq FASTQs through nf-core/rnaseq
#   (STAR/star_salmon) to BAMs and gene count matrices. The default recipe is
#   tuned so transposable-element signal also survives (the "Random-One" STAR
#   recipe + grouped-SAF integer featureCounts contract), so the same lane
#   serves plain gene-level runs AND TE-compatible runs. Terminates at count
#   matrices and hands off to the downstream annotation skill.
#
# Use when
#   - Running nf-core/rnaseq on bulk RNA-seq FASTQs (Docker, star_salmon)
#   - Building the samplesheet, managing NXF_UID/GID + work/temp dirs + disk
#   - Plain gene-level preprocessing, OR TE-compatible alignment (multimapper
#     retention, integer counts) when TE signal must be preserved
#   - Assembling gene (and TE subfamily) count matrices for downstream DE
#
# Do NOT use when
#   - Downstream TE/gene DE, enrichment, or interpretation (use base + the
#     TE-RNAseq-toolkit; for pathway/GSEA layer pathway-signature)
#   - 10x single-cell velocity alignment (base: starsolo-spliced-unspliced)
#   - Chromatin / ATAC preprocessing (use scatac-regulatory)
#
# Stack
#   Overlay on base:  sciagent activate base rnaseq-fastq-preprocessing

name: rnaseq-fastq-preprocessing
description: Bulk RNA-seq FASTQ preprocessing — nf-core/rnaseq run mechanics + the TE-compatible Random-One STAR/featureCounts recipe, FASTQ to gene (and TE) counts

agents:
  - docs-librarian
  - bio-interpreter
  - insight-explorer
  - captions
  - doc-curator
  - code-reviewer
  - handoff

skills:
  # === Reference build (once per genome build, shared across datasets) ===
  - te-reference-saf-build         # Build the shared TE GTF + grouped/no-exon SAFs for a genome build

  # === RNA-seq Preprocessing ===
  - nfcore-rnaseq-execution        # Run nf-core/rnaseq reproducibly (Docker UID, samplesheet, disk, resume)
  - star-te-preprocessing          # The TE recipe: Random-One STAR args + grouped-SAF integer featureCounts contract

  # === Counting (env-locked featureCounts) ===
  - te-gene-featurecounts          # Run TE+gene counting in the locked te-fc:2.0.2 container -> count matrices

  # === Downstream handoff (count-matrix annotation) ===
  - annotate-bulk-rnaseq-data        # Annotate gene+TE count matrices -> DGELists (next step after counts)

commands:
  - commit
