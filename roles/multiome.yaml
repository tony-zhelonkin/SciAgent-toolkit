# multiome.yaml — paired 10x Multiome (RNA + ATAC) analysis
#
# Purpose
#   Joint analysis of paired RNA+ATAC captured in the SAME cells: shared-barcode
#   integration (MultiVI / muon / WNN), consensus peak-atlas construction,
#   ATAC preprocessing, motif enrichment, peak-to-gene linkage, and coverage
#   tracks. Designed as an OVERLAY on `base` — `base` already carries the
#   scverse/scRNA foundation, MultiVI, PeakVI, pycisTopic, chromVAR, TF
#   footprinting, SCENIC+, and scGLUE; this overlay adds the paired-multiome
#   depth `base` omits.
#
# Use when
#   - 10x Multiome (ARC) with RNA + ATAC in shared barcodes
#   - Joint RNA+ATAC embedding / weighted-nearest-neighbor integration
#   - Building a consensus peak atlas for a paired dataset
#   - Motif enrichment + peak↔gene linkage on paired data
#
# Do NOT use when
#   - Unpaired RNA + ATAC (separate cell pools) — use base + scGLUE / peak-atlas-unpaired
#   - scATAC-only regulatory work (use scatac-regulatory)
#   - Plain scRNA-seq (use base)
#
# Activate as
#   si activate base multiome

name: multiome
description: Paired 10x Multiome (RNA+ATAC) integration — MultiVI/muon/WNN, consensus peak atlas, motif enrichment, peak↔gene linkage (overlay on base)

agents:
  # Research & Documentation
  - docs-librarian
  - bio-interpreter
  # Data Exploration & Analysis
  - insight-explorer
  # Publication & Documentation
  - captions
  - doc-curator
  # Code Review & Quality
  - code-reviewer
  # Session Management
  - handoff

skills:
  # === Ingestion ===
  - cellranger-arc-multiome                    # Cell Ranger ARC — paired RNA+ATAC upstream

  # === Consensus Peak Atlas (paired) ===
  - iterative-peak-merging                     # Summit-preserving peak set construction
  - peak-atlas-framework                       # Concept router: CALL->MERGE->FILTER->TIER->VALIDATE spine
  - peak-atlas-multiome                        # Paired 10x Multiome consensus peak set

  # === ATAC Preprocessing (Python) ===
  - snapatac2-atac-preprocessing               # SnapATAC2 ATAC preprocessing

  # === Multimodal Integration ===
  - multimodal-anndata-mudata                  # MuData / h5mu multi-assay containers
  - muon-multimodal-analysis                   # muon paired RNA+ATAC workflow (Python)
  - signac-chromatin-analysis                  # Signac + WNN joint integration (R)
  - seurat-multimodal-analysis                 # Seurat multimodal / WNN (R)

  # === Motif & Linkage ===
  - pycistarget-motif-enrichment               # TF motif enrichment in region sets
  - pyranges-peak-gene-linkage                 # Peak ↔ gene linkage
  - pygenometracks-coverage-plots              # Genome-track coverage visualization

# === Universal addons ===
commands:
  - commit          # clean atomic commits with brief messages, no AI attribution
  - decompose       # multi-agent, multi-pass planning campaign over large multi-artifact problems (planning only)
  - implement       # multi-agent, multi-pass implementation campaign driven by a SOLIDIFIED plan (continues /decompose)
