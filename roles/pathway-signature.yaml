# pathway-signature.yaml — Pathway / TF / signature functional interpretation
#
# Purpose
#   Functional interpretation of pseudobulk DE: multi-database GSEA, TF and
#   pathway activity inference, public-data signature search, and interactive
#   pathway-explorer dashboards.
#
# Use when
#   - Interpreting what clusters / conditions mean from pseudobulk DE
#   - Running multi-database GSEA (Hallmark, KEGG, Reactome, GO, custom sets)
#   - Layering CollecTRI TF + PROGENy activity on top of GSEA
#   - Searching public datasets for signature coregulation
#   - Emitting master_unified.csv + interactive pathway_explorer HTMLs
#
# Do NOT use when
#   - scRNA QC / integration / annotation upstream (use base)
#   - Chromatin / ATAC / regulatory work (use scatac-regulatory)
#   - Trajectory / velocity work

name: pathway-signature
description: Pathway/TF/signature functional interpretation — GSEA + decoupleR + CoReSh + pathway-explorer

agents:
  - docs-librarian
  - bio-interpreter
  - insight-explorer
  - captions
  - doc-curator
  - code-reviewer
  - handoff

skills:
  # Foundation / data I/O
  - anndata
  - scanpy
  - anndatar-seurat-scanpy-conversion

  # Consolidated bulk GSEA + activity triad
  - bulk-rnaseq-gsea
  - bulk-rnaseq-activity-inference
  - bulk-rnaseq-pathway-explorer

  # Public-data signature search
  - coresh-signature-search

  # Optional metabolic extension
  - gatom-metabolomic-predictions

# === Universal addons ===
commands:
  - commit          # clean atomic commits with brief messages, no AI attribution
  - decompose       # multi-agent, multi-pass planning campaign over large multi-artifact problems (planning only)
  - implement       # multi-agent, multi-pass implementation campaign driven by a SOLIDIFIED plan (continues /decompose)
