# science-architect.yaml — Analysis orchestration overlay role
#
# Purpose
#   Overlay for orchestrating multi-phase analysis pipelines: Opus decomposes a
#   plan into bite-sized phases (one script == one implementer), Sonnet
#   implementers execute them, and Opus reviews every N phases that code RUNS
#   and produces its declared artifacts. Claims the planning / figure /
#   interpretation orchestration commands as this role's provenance.
#
# Use when
#   - Planning or orchestrating a multi-phase analysis pipeline
#   - Running /pipeline-plan, /explore-and-plan, /add-figure-variant, or
#     /interpret-storm to drive Opus/Sonnet model-tiered execution
#   - Producing durable docs/_internal/plans/{date-slug}/ + research/ artifacts
#     for a reproducible analysis workflow
#
# Do NOT use when
#   - Software design or architecture work (use architect)
#   - Day-to-day analysis at the keyboard without pipeline orchestration (use base)
#   - Pure pathway / TF interpretation (use pathway-signature)
#
# Activation
#   sciagent activate base science-architect
#
# Composes with
#   - base — holds provenance for the analysis agent suite, figure-style,
#     reasoning-trace, scrna-pipeline-conventions and the scverse/bulk/ATAC
#     skills. All of it mounts with or without either role; pairing them just
#     splits attribution the way `sciagent status` reports it.

name: science-architect
description: Overlay for orchestrating multi-phase analysis pipelines — Opus-decomposes a plan into bite-sized phases (one script == one implementer), runs Sonnet implementers, reviews every N phases that code RUNS and produces artifacts. Attributes the planning/figure/interpretation orchestration commands to this role.

# NOTE: these lists no longer control what is mounted. `activate` mounts the
# entire catalog regardless of role; a role's lists only decide PROVENANCE —
# which role a name is attributed to in `sciagent status` and the ROLES block,
# and which slot wins when base and overlay both claim a name. An empty list
# below means "attribute nothing", not "make nothing available".

# Agents — none attributed to this overlay. The day-to-day analysis suite
# (docs-librarian, bio-interpreter, insight-explorer, captions, figure-audit,
# doc-curator, code-reviewer, handoff) is attributed to base. Orchestration-
# specific subagents (pipeline planner, phase reviewer) are not written yet;
# they will be attributed here alongside the commands they serve.
agents: []

# Skills attributed to this overlay. reasoning-trace, figure-style,
# scrna-pipeline-conventions and the scverse/bulk/ATAC suite are attributed to
# base; the three below are the orchestration-specific ones:
skills:
  - delegate-cli            # hand off / consult work to the local codex (GPT-5.x) & agy (Gemini) headless CLIs — implementation → codex, web-research/large-context → agy
  - decision-gate-notebook  # at a pipeline inflection point, scaffold a read-only Quarto review notebook that re-plots the stage output and gates the next stage on decisions.<stage>.status: APPROVED in analysis_config.yaml
  - interactive-breakpoint-explorer  # the live-kernel sibling: a Python .qmd drives jscatter linked panels to brush/lasso cells, persists barcodes + a labelled snapshot, and feeds the decision gate (export-first parquet; grid()/close_panels() OOM hygiene)

# Commands — orchestration commands are wired in by phases P19-P22:
#   /pipeline-plan      (P19) — plan + orchestrate a multi-phase pipeline   [WIRED]
#   /explore-and-plan   (P20) — research fan-out → synthesis → pipeline-plan
#   /add-figure-variant (P21) — new figure family with its own namespace
#   /interpret-storm    (P22) — multi-wave interpretation + information-graphic design
# resolve_canonical recursively finds commands/science/<name>.md, so the role
# lists the bare command name (no subdir). P20-P22 commands are added here as
# their files land.
commands:
  - pipeline-plan       # P19 — Opus-decompose → Sonnet-impl → Opus-review-every-N + runnable artifacts gate (commands/science/)
  - explore-and-plan    # P20 — research fan-out (Opus explorers) → synthesis → /pipeline-plan handoff (commands/science/)
  - add-figure-variant  # P21 — new figure family with its own namespace, compute→viz split, dual-format (PDF + PNG) output, namespace-isolation grep gate (commands/science/)
  - interpret-storm     # P22 — multi-wave interpretation (web research → interpret → design → /add-figure-variant build), every wave persisted (commands/science/)
