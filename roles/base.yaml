# base.yaml — Default bioinformatics analysis role
#
# Purpose
#   The day-to-day analysis stack: scverse foundation, bulk and single-cell
#   RNA-seq, scATAC, multiomics integration, GRN inference, and the seven
#   on-demand helper agents that cover docs lookup, biological interpretation,
#   data exploration, captions, doc curation, code review, and handoffs.
#
# Use when
#   - General RNA-seq or single-cell analysis at the keyboard
#   - Exploratory work that doesn't warrant the architect pipeline
#   - Default starting point for new projects
#
# Do NOT use when
#   - Design-before-code work (use architect)
#   - Pure pathway/TF interpretation (use pathway-signature)

name: base
description: Default bioinformatics analysis role with full agent suite

# Agents to activate (reference by filename without .md)
# These will be symlinked from agents/ to .claude/agents/
agents:
  # Research & Documentation
  - docs-librarian
  - bio-interpreter
  # Data Exploration & Analysis
  - insight-explorer
  # Publication & Documentation
  - captions
  - doc-curator
  # Code Review & Quality
  - code-reviewer
  # Session Management
  - handoff

# Skills to activate (reference by filename without .md)
# These will be symlinked from skills/ to .claude/skills/
skills:
  # scverse Foundation
  - anndata                            # AnnData data structure — foundation for scverse ecosystem
  - scanpy                             # Standard scRNA-seq QC, clustering, visualization
  - single-cell-rna-qc                 # MAD-based QC filtering for scRNA-seq
  # Data conversion
  - anndatar-seurat-scanpy-conversion  # Seurat ↔ Scanpy format conversion
  # Bulk RNA-seq GSEA pipeline
  - bulk-rnaseq-gsea                  # GSEA pipeline router: MSigDB, custom DBs, master tables, visualization
  - bulk-rnaseq-activity-inference     # Activity inference router: DecoupleR TF (ULM+CollecTRI), PROGENy (MLM), visualization
  - bulk-rnaseq-pathway-explorer      # Interactive HTML pathway/TF/PROGENy/TE dashboards from master tables
  - gatom-metabolomic-predictions      # GATOM metabolomics
  - coresh-signature-search            # CORESH: rank ~80K public GEO datasets by coregulation of a gene signature
  # RNA velocity & trajectory inference
  - starsolo-spliced-unspliced         # STARsolo Velocyto mode: spliced/unspliced from FASTQ
  - rna-velocity-trajectory            # scVelo, VeloVI, Chronocell, CellRank
  # Meta-program discovery
  - genenmf-metaprogram-discovery      # GeneNMF for meta-program/signature discovery
  # scATAC-seq analysis
  - pycistopic-atac-topic-modeling     # Topic modeling for ATAC
  - crescendo-scatac-cre-analysis      # CRE differential analysis
  - chromvar-motif-accessibility       # TF motif activity from chromatin accessibility
  - tf-footprint-differential-analysis # TF footprinting & differential binding (TOBIAS/HINT-ATAC/Signac)
  # GRN inference
  - scenic-grn-inference               # SCENIC+ eRegulon inference (multiome + unpaired)
  # scvi-tools ecosystem (all submodules)
  - scvi-framework                     # scvi-tools foundation overview
  - scvi-basic                         # Core scVI model for scRNA-seq
  - scvi-scanvi                        # Semi-supervised annotation with scANVI
  - scvi-multivi                       # Joint RNA+ATAC with MultiVI
  - scvi-peakvi                        # scATAC-seq with PeakVI
  - scvi-mrvi                          # Multi-resolution variational inference
  - scvi-contrastivevi                 # Contrastive analysis between conditions
  - scvi-linearscvi                    # LinearSCVI for interpretable factors
  - scvi-lda                           # Latent Dirichlet Allocation for topics
  - scvi-hub-models                    # Pre-trained models from scvi-hub
  - scvi-scarches-reference-mapping    # scArches query-to-reference mapping
  - treearches-hierarchy-learning      # treeArches hierarchical cell type learning
  # Multiomics integration
  - scglue-unpaired-multiomics-integration  # scGLUE for unpaired scRNA+scATAC integration
  # scRNA-seq workflow (project-specific house style + ingestion + hosting + cNMF)
  - scrna-pipeline-conventions         # House style: numbered scripts, multi-checkpoint, config.py, 03_results/ layout
  - cellranger-multi-to-anndata        # CellRanger Multi → AnnData with gene-union concat + biomart symbols
  - scrna-cxg-host                     # CellxGene schema prep + Docker Compose deployment (nginx + htpasswd)
  - shinymultiome-uio-host             # Signac multiome → ShinyMultiome.UiO Shiny app (object preflight + Docker deploy)
  - consensus-nmf-multirun             # Multi-run consensus cNMF: full ± QC × subset ± QC, merge, annotate, ANOVA
  # Meta — skill authoring
  - skill-creator                       # Meta-skill: create, evaluate, improve Claude Code skills

# === Universal addons ===
commands:
  - commit          # clean atomic commits with brief messages, no AI attribution
  - decompose       # multi-agent, multi-pass planning campaign over large multi-artifact problems (planning only)
  - implement       # multi-agent, multi-pass implementation campaign driven by a SOLIDIFIED plan (continues /decompose)
