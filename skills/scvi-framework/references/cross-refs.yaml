# Curated cross-reference map for the scvi-tools skill cluster — a design record
# of the intended routing graph, kept for reference when writing or auditing the
# "See also" prose in each skill's SKILL.md body.
#
# Each key is a skill name; each value is the list of skill names it should route to.
# There is no `metadata.complementary-skills` frontmatter anymore (that mechanism was
# retired) and no automated validator checks this file against the SKILL.md bodies —
# it is not enforced, so it can drift from the prose. Treat it as a curated starting
# point when adding or reviewing routing edges, not as ground truth to diff against.

