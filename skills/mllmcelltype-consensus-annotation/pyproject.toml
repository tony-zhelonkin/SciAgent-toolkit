# mllmct — version-locked CLI for mLLMCelltype multi-LLM consensus annotation.
#
# Regenerate the lock ONLY with:
#     uv lock
# and then you MUST verify the monkeypatch seams still hold:
#     uv run python checks/smoke_check_versions.py
#
# The four pins below (== exact) are not arbitrary: mllmct wraps VERSION-SENSITIVE
# internals of these packages (attribute names + call signatures, not public APIs).
# A loose bump can silently no-op a wrapper. See references/monkeypatch-internals.md.
[project]
name = "mllmct"
version = "0.2.0"
description = "Version-locked CLI for mLLMCelltype multi-LLM consensus cell-type / cell-state annotation with token capture, forced determinism, Python-recomputed consensus metrics, and a full reproducibility trace."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
dependencies = [
    # --- the library whose internals we monkeypatch (pin EXACT) ---
    "mllmcelltype==2.0.5",
    # --- monkeypatch-sensitive transitive deps, pinned EXACT ---
    "google-genai==2.6.0",   # GeminiTokenCapture binds GenerateContentResponse.usage_metadata + GenerateContentConfig.seed/temperature
    "pydantic==2.13.3",      # _force_deterministic_config uses pydantic-v2 model_copy(update=...)
    "requests==2.33.1",      # OpenRouterCapture patches mllmcelltype.providers.openrouter.requests.post
    # --- direct deps used by our own code ---
    "pandas>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",    # optional --env-file loading (already a mllmcelltype transitive)
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
mllmct = "mllmct.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mllmct"]

[tool.uv]
# uv venvs do not inherit /opt/venvs/base or system site-packages — a clean sandbox by default.
